<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <title>Chosenwan Logo Stacked</title>
  <!-- Symbol scaled and centered at top -->
  <g transform="translate(85, 24) scale(0.5859375)">
    <rect x="32" y="32" width="88" height="88" rx="28" fill="#111318" />
    <rect x="136" y="32" width="88" height="88" rx="44" fill="#F6C866" />
    <rect x="32" y="136" width="88" height="88" rx="44" fill="#A8C0FF" />
    <rect x="136" y="136" width="88" height="88" rx="28" fill="#EA9DFB" />
  </g>
  <!-- Wordmark "Chosenwan" centered without IF-A -->
  <text x="160" y="228" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" fill="#111318" letter-spacing="-1" text-anchor="middle">Chosenwan</text>
  <text x="160" y="258" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#6E7485" letter-spacing="2.5" text-anchor="middle">PORTAL INFORMASI KELAS</text>
